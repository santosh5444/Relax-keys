<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Backing Plate with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d16" stroke="#1f293d" stroke-width="2"/>

  <!-- Subtle Shield Aura -->
  <path d="M32 8 C44 8 50 14 50 25 C50 41 32 54 32 54 C32 54 14 41 14 25 C14 14 20 8 32 8 Z" 
        fill="url(#shieldGlow)" stroke="url(#cyberGrad)" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Cyber Key Body (Angled 45 deg) with Neon Glow -->
  <g filter="url(#neonBlur)">
    <!-- Key Bow (Head) - Rounded Shield Ring -->
    <circle cx="26" cy="26" r="11" stroke="url(#cyberGrad)" stroke-width="3.5" fill="none"/>
    <circle cx="26" cy="26" r="4" fill="url(#cyberGrad)"/>

    <!-- Key Shaft -->
    <path d="M34 34 L49 49" stroke="url(#cyberGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Digital Circuit Teeth -->
    <path d="M42 42 L47 37" stroke="url(#cyberGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 46 L51 41" stroke="url(#cyberGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="47" cy="37" r="1.5" fill="#34d399"/>
    <circle cx="51" cy="41" r="1.5" fill="#06b6d4"/>
  </g>
</svg>